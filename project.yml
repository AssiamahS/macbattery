name: MacBattery
options:
  bundleIdPrefix: com.sylvester
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: QGMAWHX827
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  MacBattery:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: MacBatteryWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sylvester.macbattery
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_XR_DESIGNED_FOR: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleName: MacBattery
        CFBundleDisplayName: Mac Battery
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  MacBatteryWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: MacBatteryWidget
        CFBundleDisplayName: Mac Battery
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sylvester.macbattery.widget
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
schemes:
  MacBattery:
    build:
      targets:
        MacBattery: all
    run:
      config: Debug
